<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Omnicast</title>
    <meta name="description" content="Upload once, publish everywhere — Omnicast schedules and publishes your videos to YouTube, TikTok, Instagram and Facebook automatically." />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Apply the theme before first paint — mirrors detect() in
      // src/lib/useTheme.ts (same storage key + OS fallback). Without this
      // the `dark` class only exists once Topbar mounts inside the app
      // shell, leaving public pages (login/register/landing) with whatever
      // stale class survived the last session.
      (function () {
        var t;
        try {
          t = window.localStorage.getItem('Omnicast.theme');
        } catch (e) {
          t = null;
        }
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.classList.toggle('dark', t === 'dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
