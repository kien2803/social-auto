<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Omnicast — cross-library picks</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#faf6ef;--ink:#221d18;--muted:#8a8177;--line:#e6ddcf;--verm:#c93f0b;--surf:#fffdf9;--bg2:#16130f;--ink2:#e8e2d8;--line2:#2c2721}
*{margin:0;box-sizing:border-box}body{font-family:'IBM Plex Sans';background:var(--paper);color:var(--ink)}
.wrap{max-width:1080px;margin:0 auto;padding:48px 28px}
h1{font:700 28px 'Space Grotesk';margin-bottom:4px}.sub{font:11px 'IBM Plex Mono';color:var(--muted);margin-bottom:36px}
h2{font:600 13px 'Space Grotesk';margin:34px 0 12px}
.slot{display:grid;grid-template-columns:110px repeat(6,1fr);border:1px solid var(--line);background:var(--surf);border-bottom:0}
.slot:last-of-type{border-bottom:1px solid var(--line)}
.slot .sl{padding:14px 12px;font:600 12px 'IBM Plex Sans';border-right:1px solid var(--line);display:flex;align-items:center}
.slot .c{padding:14px 8px;border-right:1px solid var(--line);text-align:center}
.slot .c:last-child{border-right:0}
.slot .c img{width:26px;height:26px;display:inline-block;filter:invert(14%) sepia(8%) saturate(500%) hue-rotate(335deg) brightness(95%)}
.slot .c img.ok{filter:invert(38%) sepia(92%) saturate(1400%) hue-rotate(0deg) brightness(92%)}
.slot .c .lib{font:9px 'IBM Plex Mono';color:var(--muted);margin-top:6px}
.dark{background:var(--bg2);border-radius:8px;padding:28px;margin-top:20px}
.dark .slot{background:#1e1a15;border-color:var(--line2)}
.dark .slot .sl,.dark .slot .c{border-color:var(--line2)}
.dark .slot .sl{color:var(--ink2)}
.dark .slot .c img{filter:invert(88%) sepia(6%) saturate(300%)}
.legend{display:flex;gap:18px;font:10px 'IBM Plex Mono';color:var(--muted);margin-bottom:20px;flex-wrap:wrap}
.legend b{color:var(--verm)}
</style></head><body>
<div class="wrap">
<div class="sub">iconify.design · tabler · lucide · solar · phosphor · iconoir · heroicons</div>
<h1>Cross-library picks</h1>
<p style="font-size:13px;color:var(--muted);margin-bottom:32px">Same slot, 5–6 libraries side by side. Star = recommended for the broadcast tone.</p>
<div class="legend"><span><b>★</b> recommended</span><span>tabler = broadest + broadcast-native</span><span>lucide = clean default</span><span>solar = rounded modern</span></div>
<div id="root"></div>
<div class="sec"><h2>Dark surface</h2><div class="dark" id="dark"></div></div>
</div>
<script>
const I='https://api.iconify.design/';
const SLOTS=[
 ['dashboard',[['★','tabler/layout-dashboard'],['lucide/layout-dashboard'],['solar/widget-5-outline'],['ph/squares-four'],['iconoir/dashboard-dots'],['heroicons/squares-2x2']]],
 ['upload',[['★','tabler/cloud-upload'],['lucide/cloud-upload'],['solar/upload-outline'],['ph/cloud-arrow-up'],['iconoir/upload'],['heroicons/arrow-up-tray']]],
 ['calendar',[['★','tabler/calendar-time'],['lucide/calendar-days'],['solar/calendar-outline'],['ph/calendar-dots'],['iconoir/calendar'],['heroicons/calendar-days']]],
 ['timetable',[['★','tabler/calendar-week'],['lucide/calendar-range'],['solar/calendar-search-outline'],['ph/calendar-check'],['iconoir/calendar-rotate'],['heroicons/table-cells']]],
 ['pipeline',[['★','tabler/timeline'],['lucide/workflow'],['solar/station-outline'],['ph/git-branch'],['iconoir/strategy'],['heroicons/arrows-right-left']]],
 ['history',[['★','tabler/history'],['lucide/history'],['solar/history-outline'],['ph/clock-counter-clockwise'],['iconoir/history'],['heroicons/clock']]],
 ['accounts',[['★','tabler/users-group'],['lucide/users-round'],['solar/users-group-rounded-outline'],['ph/users'],['iconoir/community'],['heroicons/user-group']]],
 ['analytics',[['★','tabler/chart-bars'],['lucide/chart-column'],['solar/chart-2-outline'],['ph/chart-bar'],['iconoir/stats-up-square'],['heroicons/chart-bar']]],
 ['settings',[['★','tabler/settings'],['lucide/sliders-horizontal'],['solar/tuning-2-outline'],['ph/sliders-horizontal'],['iconoir/settings'],['heroicons/cog-6-tooth']]],
 ['broadcast',[['★','tabler/tower-broadcast'],['tabler/antenna-bars-5'],['solar/broadcast-outline'],['ph/broadcast'],['ri/antenna-line'],['iconoir/antenna-signal-tag']]],
 ['video',[['★','tabler/video'],['lucide/clapperboard'],['solar/videocamera-outline'],['ph/film-strip'],['iconoir/media-video'],['heroicons/film']]],
 ['quota',[['★','tabler/gauge'],['lucide/gauge'],['solar/gauge-outline'],['ph/gauge'],['iconoir/dashboard-speed'],['heroicons/signal']]],
 ['fault',[['★','tabler/alert-triangle'],['lucide/triangle-alert'],['solar/danger-triangle-outline'],['ph/warning'],['iconoir/warning-triangle'],['heroicons/exclamation-triangle']]],
 ['aired',[['★','tabler/circle-check'],['lucide/circle-check-big'],['solar/check-circle-outline'],['ph/check-circle'],['iconoir/check-circle'],['heroicons/check-circle']]],
 ['queued',[['★','tabler/clock-hour-4'],['lucide/clock'],['solar/clock-circle-outline'],['ph/clock'],['iconoir/time'],['heroicons/clock']]],
 ['security',[['★','tabler/shield-check'],['lucide/shield-check'],['solar/shield-check-outline'],['ph/shield-check'],['iconoir/shield-alt'],['heroicons/shield-check']]],
 ['retry',[['★','tabler/refresh'],['lucide/refresh-cw'],['solar/restart-outline'],['ph/arrow-clockwise'],['iconoir/refresh'],['heroicons/arrow-path']]],
 ['youtube',[['★','tabler/brand-youtube'],['simple-icons/youtube'],['ri/youtube-line'],['bi/youtube'],['lucide/youtube'],['iconoir/youtube']]],
 ['tiktok',[['★','tabler/brand-tiktok'],['simple-icons/tiktok'],['ri/tiktok-line'],['bi/tiktok'],['lucide/music-2'],['fa6-brands/tiktok']]],
 ['instagram',[['★','tabler/brand-instagram'],['simple-icons/instagram'],['ri/instagram-line'],['bi/instagram'],['lucide/instagram'],['fa6-brands/instagram']]],
 ['facebook',[['★','tabler/brand-facebook'],['simple-icons/facebook'],['ri/facebook-box-line'],['bi/facebook'],['lucide/facebook'],['fa6-brands/facebook-f']]],
];
function row(slot){
  const d=document.createElement('div');d.className='slot';
  const l=document.createElement('div');l.className='sl';l.textContent=slot[0];d.appendChild(l);
  for(const item of slot[1]){
    const[star,name]=item;
    const c=document.createElement('div');c.className='c';
    const img=document.createElement('img');img.src=I+name+'.svg';img.loading='lazy';
    if(star)img.className='ok';
    c.appendChild(img);
    const lib=document.createElement('div');lib.className='lib';lib.textContent=(star||'')+name;
    c.appendChild(lib);d.appendChild(c);
  }
  return d;
}
const root=document.getElementById('root');
const dark=document.getElementById('dark');
const h2=document.createElement('h2');h2.textContent='Nav + broadcast slots';root.appendChild(h2);
SLOTS.slice(0,14).forEach(s=>root.appendChild(row(s)));
const h2b=document.createElement('h2');h2b.textContent='Platform brands';root.appendChild(h2b);
SLOTS.slice(17).forEach(s=>root.appendChild(row(s)));
SLOTS.slice(0,10).forEach(s=>dark.appendChild(row(s)));
</script></body></html>
