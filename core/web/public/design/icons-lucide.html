<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Omnicast — lucide picks</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#faf6ef;--ink:#221d18;--muted:#8a8177;--line:#e6ddcf;--verm:#c93f0b;--surf:#fffdf9;--bg2:#16130f;--ink2:#e8e2d8;--line2:#2c2721}
*{margin:0;box-sizing:border-box}body{font-family:'IBM Plex Sans';background:var(--paper);color:var(--ink)}
.wrap{max-width:980px;margin:0 auto;padding:48px 28px}
h1{font:700 28px 'Space Grotesk';margin-bottom:4px}.sub{font:11px 'IBM Plex Mono';color:var(--muted);margin-bottom:36px}
h2{font:600 13px 'Space Grotesk';margin:34px 0 12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);background:var(--surf)}
.cell{padding:22px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center}
.cell svg{width:30px;height:30px;color:var(--ink);display:inline-block}
.cell .n{font:600 11px 'IBM Plex Sans';margin-top:10px}
.cell .c{font:9px 'IBM Plex Mono';color:var(--muted);margin-top:2px}
.cell.alt svg{color:var(--verm)}
.dock{display:flex;gap:6px;padding:10px 14px;background:rgba(255,253,249,.9);border:1px solid var(--line);border-radius:22px;width:max-content;margin:16px auto 0;box-shadow:0 12px 32px rgba(60,45,30,.14)}
.dock i{display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:14px;background:var(--paper);border:1px solid var(--line);color:var(--muted);transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.dock i svg{width:24px;height:24px}
.dock i:hover{transform:translateY(-10px) scale(1.18)}
.dock i.on{color:var(--verm);background:#fdf1ea;border-color:#eccfbf}
.dark{background:var(--bg2);border-radius:8px;padding:28px;margin-top:20px}
.dark .cell{border-color:var(--line2);background:#1e1a15}
.dark .cell svg{color:var(--ink2)}
.dark .cell .n{color:var(--ink2)}
</style></head><body>
<div class="wrap">
<div class="sub">lucide.dev · stroke 2 · curated for omnicast</div>
<h1>Lucide picks</h1>
<p style="font-size:13px;color:var(--muted);margin-bottom:32px">Recommended set — broadcast-tone icons where possible, clean utility elsewhere. Alternatives shown per slot.</p>

<h2>Navigation (dock)</h2>
<div class="grid" id="nav"></div>
<div class="sec"><div class="dock" id="dock"></div></div>

<h2>Alternatives</h2>
<div class="grid" id="alt"></div>

<h2>Utility &amp; status</h2>
<div class="grid" id="util"></div>

<h2>Dark surface</h2>
<div class="dark"><div class="grid" id="dark"></div></div>
</div>
<script>
const L = 'https://unpkg.com/lucide-static@latest/icons/';
const NAV = [
  ['dashboard','layout-dashboard'],
  ['upload','cloud-upload'],
  ['calendar','calendar-days'],
  ['pipeline','workflow'],
  ['history','history'],
  ['accounts','users-round'],
  ['analytics','chart-column'],
  ['settings','sliders-horizontal'],
];
const ALT = [
  ['dashboard','square-activity'],['dashboard','gauge'],
  ['upload','upload'],['upload','arrow-up-from-line'],
  ['calendar','calendar-clock'],['calendar','calendar-range'],
  ['pipeline','git-branch'],['pipeline','route'],
  ['accounts','share2'],['accounts','link2'],
  ['analytics','chart-line'],['analytics','chart-no-axes-column'],
  ['broadcast','radio-tower'],['live','radio'],
];
const UTIL = [
  ['video','video'],['video alt','clapperboard'],
  ['quota','gauge'],['quota alt','activity'],
  ['fault','triangle-alert'],['success','circle-check-big'],
  ['queued','clock'],['aired','send'],
  ['security','shield-check'],['logout','log-out'],
  ['search','search'],['plus','plus'],
  ['edit','pencil'],['delete','trash-2'],
  ['refresh','refresh-cw'],['external','external-link'],
];
const DARK = NAV.slice(0,6);
async function icon(name){
  const r = await fetch(L + name + '.svg');
  if (!r.ok) return document.createElement('span');
  const t = document.createElement('template');
  t.innerHTML = await r.text();
  return t.content.firstChild;
}
async function cell(label, name, verm){
  const d = document.createElement('div');
  d.className = 'cell' + (verm ? ' alt' : '');
  d.appendChild(await icon(name));
  const n = document.createElement('div'); n.className='n'; n.textContent=label;
  const c = document.createElement('div'); c.className='c'; c.textContent=name;
  d.appendChild(n); d.appendChild(c);
  return d;
}
(async () => {
  const nav = document.getElementById('nav');
  for (const [l,n] of NAV) nav.appendChild(await cell(l,n));
  const alt = document.getElementById('alt');
  for (const [l,n] of ALT) alt.appendChild(await cell(l,n,true));
  const ut = document.getElementById('util');
  for (const [l,n] of UTIL) ut.appendChild(await cell(l,n));
  const dk = document.getElementById('dark');
  for (const [l,n] of DARK) dk.appendChild(await cell(l,n));
  const dock = document.getElementById('dock');
  NAV.forEach(async ([l,n],i) => {
    const e = document.createElement('i');
    if (i===2) e.className='on';
    e.appendChild(await icon(n));
    dock.appendChild(e);
  });
})();
</script></body></html>
