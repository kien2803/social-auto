<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Omnicast — morphicon set</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#faf6ef;--ink:#221d18;--muted:#8a8177;--line:#e6ddcf;--verm:#c93f0b;--surf:#fffdf9;--bg2:#16130f;--ink2:#e8e2d8;--line2:#2c2721}
*{margin:0;box-sizing:border-box}body{font-family:'IBM Plex Sans';background:var(--paper);color:var(--ink)}
.wrap{max-width:960px;margin:0 auto;padding:48px 28px}
h1{font:700 28px 'Space Grotesk';margin-bottom:4px}.sub{font:11px 'IBM Plex Mono';color:var(--muted);margin-bottom:36px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);background:var(--surf)}
.cell{padding:30px 20px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center;cursor:pointer}
.cell svg{width:46px;height:46px;color:var(--ink)}
.cell .n{font:600 12px 'IBM Plex Sans';margin-top:12px}
.cell .u{font:9px 'IBM Plex Mono';color:var(--muted);margin-top:3px}
.sec{margin-top:44px}
.sec h2{font:600 14px 'Space Grotesk';margin-bottom:14px}
.dock{display:flex;gap:6px;padding:10px 14px;background:rgba(255,253,249,.9);border:1px solid var(--line);border-radius:22px;width:max-content;margin:0 auto;box-shadow:0 12px 32px rgba(60,45,30,.14)}
.dock i{display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:14px;background:var(--paper);border:1px solid var(--line);color:var(--muted);cursor:pointer;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.dock i svg{width:24px;height:24px}
.dock i:hover{transform:translateY(-10px) scale(1.18)}
.dock i.on{color:var(--verm);background:#fdf1ea;border-color:#eccfbf}
.dark{background:var(--bg2);border-radius:8px;padding:28px;margin-top:20px}
.dark .grid{background:#1e1a15;border-color:var(--line2)}
.dark .cell{border-color:var(--line2)}
.dark .cell svg{color:var(--ink2)}
.dark .cell .n{color:var(--ink2)}
</style></head><body>
<div class="wrap">
<div class="sub">morphicons/dom · spring morph · stroke 1.7 · hover or click to morph</div>
<h1>Omnicast morphicons</h1>
<p style="font-size:13px;color:var(--muted);margin-bottom:32px">Every icon morphs between its rest and active form — the state change IS the animation.</p>
<div class="grid" id="grid"></div>
<div class="sec"><h2>In the dock — hover to morph</h2>
<div class="dock" id="dock"></div></div>
<div class="sec"><h2>Dark surface</h2>
<div class="dark"><div class="grid" id="gridDark"></div></div></div>
</div>
<script type="module">
import { createMorph } from 'https://esm.sh/morphicons@2.0.2/dom';

const ICONS = [
  { name:'dashboard', u:'hub → grid',
    a:'M12 12m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0 M12 9V4 M9.5 10.5 5 8 M14.5 10.5 19 8',
    b:'M4 4h6v6H4z M14 4h6v6h-6z M4 14h6v6H4z M14 14h6v6h-6z' },
  { name:'upload', u:'arrow → antenna',
    a:'M12 17V7 M8.5 10.5 12 7l3.5 3.5 M5 19h14',
    b:'M12 19.5m-1.5 0a1.5 1.5 0 1 0 3 0a1.5 1.5 0 1 0 -3 0 M8.5 12a3.5 3.5 0 0 1 7 0 M5.5 12a6.5 6.5 0 0 1 13 0' },
  { name:'calendar', u:'timetable → add slot',
    a:'M4 6h16v14H4z M4 11h16 M9 4v4 M15 4v4',
    b:'M4 6h16v14H4z M4 11h16 M9 4v4 M15 4v4 M12 12.5v4 M10 14.5h4' },
  { name:'pipeline', u:'nodes → flow',
    a:'M5 12m-1.5 0a1.5 1.5 0 1 0 3 0a1.5 1.5 0 1 0 -3 0 M12 12m-1.5 0a1.5 1.5 0 1 0 3 0a1.5 1.5 0 1 0 -3 0 M19 12m-1.5 0a1.5 1.5 0 1 0 3 0a1.5 1.5 0 1 0 -3 0 M6.5 12h4 M13.5 12h4',
    b:'M4 6h16 M4 12h16 M4 18h16 M8 4v4 M15 10v4 M10 16v4' },
  { name:'history', u:'clock → resume play',
    a:'M12 21a9 9 0 1 0-9-9 M3 8v4h4 M12 8v4l3.5-2',
    b:'M12 21a9 9 0 1 0-9-9 M3 8v4h4 M9.5 8.5l6 3.5-6 3.5z' },
  { name:'analytics', u:'bars → waveform',
    a:'M4 20h16 M6 20v-5 M10.5 20V9 M15 20v-7 M19.5 20V6',
    b:'M4 20h16 M4 12h3l2.5-6 4 12 2.5-6h4' },
  { name:'settings', u:'gear → tuner dial',
    a:'M12 12m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0 M12 4v2 M12 18v2 M4 12h2 M18 12h2 M6.5 6.5l1.4 1.4 M17.5 17.5l-1.4-1.4 M6.5 17.5l1.4-1.4 M17.5 6.5l-1.4 1.4',
    b:'M12 12m-8 0a8 8 0 1 0 16 0a8 8 0 1 0 -16 0 M12 12m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0 M12 12l5-5' },
  { name:'accounts', u:'hub → connected',
    a:'M12 12m-2.6 0a2.6 2.6 0 1 0 5.2 0a2.6 2.6 0 1 0 -5.2 0 M5 6m-1.4 0a1.4 1.4 0 1 0 2.8 0a1.4 1.4 0 1 0 -2.8 0 M19 6m-1.4 0a1.4 1.4 0 1 0 2.8 0a1.4 1.4 0 1 0 -2.8 0 M12 20m-1.4 0a1.4 1.4 0 1 0 2.8 0a1.4 1.4 0 1 0 -2.8 0 M10.2 10 6.5 7.4 M13.8 10l3.7-2.6 M12 14.6v3.6',
    b:'M12 12m-2.6 0a2.6 2.6 0 1 0 5.2 0a2.6 2.6 0 1 0 -5.2 0 M5 6m-1.4 0a1.4 1.4 0 1 0 2.8 0a1.4 1.4 0 1 0 -2.8 0 M19 6m-1.4 0a1.4 1.4 0 1 0 2.8 0a1.4 1.4 0 1 0 -2.8 0 M12 20m-1.4 0a1.4 1.4 0 1 0 2.8 0a1.4 1.4 0 1 0 -2.8 0 M10.2 10 6.5 7.4 M13.8 10l3.7-2.6 M12 14.6v3.6 M4 4l2 2 M20 4l-2 2 M13 21.5l-2-2' },
  { name:'security', u:'shield → unlocked',
    a:'M12 3.5 19.5 7v5c0 4.5-3.2 7.7-7.5 8.5-4.3-.8-7.5-4-7.5-8.5V7z M12 12m-1.5 0a1.5 1.5 0 1 0 3 0a1.5 1.5 0 1 0 -3 0 M12 13.5v2.5',
    b:'M12 3.5 19.5 7v5c0 4.5-3.2 7.7-7.5 8.5-4.3-.8-7.5-4-7.5-8.5V7z M12 12m-1.5 0a1.5 1.5 0 1 0 3 0a1.5 1.5 0 1 0 -3 0 M12 13.5v2.5 M8 4l1.5-1.5' },
];

function makeCell(ic, stateful){
  const cell = document.createElement('div');
  cell.className = 'cell';
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 24 24');
  svg.setAttribute('fill','none'); svg.setAttribute('stroke','currentColor');
  svg.setAttribute('stroke-width','1.7'); svg.setAttribute('stroke-linecap','round'); svg.setAttribute('stroke-linejoin','round');
  const path = document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d', ic.a);
  svg.appendChild(path);
  cell.appendChild(svg);
  const n = document.createElement('div'); n.className='n'; n.textContent = ic.name;
  const u = document.createElement('div'); u.className='u'; u.textContent = ic.u;
  cell.appendChild(n); cell.appendChild(u);
  const m = createMorph(path, ic.a);
  let on = false;
  const go = () => m.morphTo(on ? ic.b : ic.a, 'snappy');
  if (stateful === 'hover'){
    cell.addEventListener('mouseenter', ()=>{on=true;go();});
    cell.addEventListener('mouseleave', ()=>{on=false;go();});
  } else {
    cell.addEventListener('click', ()=>{on=!on;go();});
  }
  return cell;
}

const grid = document.getElementById('grid');
const gridDark = document.getElementById('gridDark');
for (const ic of ICONS){ grid.appendChild(makeCell(ic,'click')); gridDark.appendChild(makeCell(ic,'hover')); }

// dock: hover-morph
const dock = document.getElementById('dock');
for (const ic of ICONS.slice(0,8)){
  const el = document.createElement('i');
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 24 24');
  svg.setAttribute('fill','none'); svg.setAttribute('stroke','currentColor');
  svg.setAttribute('stroke-width','1.7'); svg.setAttribute('stroke-linecap','round'); svg.setAttribute('stroke-linejoin','round');
  const path = document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d', ic.a);
  svg.appendChild(path); el.appendChild(svg);
  const m = createMorph(path, ic.a);
  el.addEventListener('mouseenter', ()=>{ el.classList.add('on'); m.morphTo(ic.b,'snappy'); });
  el.addEventListener('mouseleave', ()=>{ el.classList.remove('on'); m.morphTo(ic.a,'snappy'); });
  dock.appendChild(el);
}
</script></body></html>
