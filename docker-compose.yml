version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: core/api/Dockerfile
    container_name: social-auto-api
    ports:
      - "3000:3000"
    environment:
      - API_PORT=3000
      - API_HOST=0.0.0.0
      - WEB_ORIGIN=http://localhost:3000
      - DATABASE_URL=file:./storage/app.db
      - STORAGE_DIR=./storage
      - STORAGE_QUOTA_GB=10
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY}
      - USE_MOCK_GOOGLE=${USE_MOCK_GOOGLE:-true}
      - USE_MOCK_PUBLISHERS=${USE_MOCK_PUBLISHERS:-true}
      - USE_MOCK_TIKTOK=${USE_MOCK_TIKTOK:-true}
      - USE_MOCK_META=${USE_MOCK_META:-true}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:3000/auth/callback}
      - TIKTOK_CLIENT_KEY=${TIKTOK_CLIENT_KEY}
      - TIKTOK_CLIENT_SECRET=${TIKTOK_CLIENT_SECRET}
      - TIKTOK_REDIRECT_URI=${TIKTOK_REDIRECT_URI:-http://localhost:3000/auth/tiktok/callback}
      - META_APP_ID=${META_APP_ID}
      - META_APP_SECRET=${META_APP_SECRET}
      - META_REDIRECT_URI=${META_REDIRECT_URI:-http://localhost:3000/auth/meta/callback}
      - META_API_VERSION=${META_API_VERSION:-v24.0}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SENTRY_DSN=${SENTRY_DSN}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
    volumes:
      - storage-volume:/app/storage
      - db-volume:/app/core/api/storage
    restart: unless-stopped
    networks:
      - social-auto-network

  worker:
    build:
      context: .
      dockerfile: core/worker/Dockerfile
    container_name: social-auto-worker
    environment:
      - DATABASE_URL=file:./storage/app.db
      - STORAGE_DIR=./storage
      - STORAGE_QUOTA_GB=10
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY}
      - USE_MOCK_PUBLISHERS=${USE_MOCK_PUBLISHERS:-true}
      - USE_MOCK_TIKTOK=${USE_MOCK_TIKTOK:-true}
      - USE_MOCK_META=${USE_MOCK_META:-true}
      - POLL_INTERVAL_MS=${POLL_INTERVAL_MS:-30000}
      - UPLOAD_CONCURRENCY=${UPLOAD_CONCURRENCY:-3}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SENTRY_DSN=${SENTRY_DSN}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
    volumes:
      - storage-volume:/app/storage
      - db-volume:/app/core/worker/storage
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - social-auto-network

volumes:
  storage-volume:
    driver: local
  db-volume:
    driver: local

networks:
  social-auto-network:
    driver: bridge
