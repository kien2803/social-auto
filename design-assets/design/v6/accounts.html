<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V6 — Accounts</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#faf6ef;--ink:#221d18;--muted:#8a8177;--line:#e6ddcf;--verm:#c93f0b;--surf:#fffdf9}
*{margin:0;box-sizing:border-box}body{font-family:'IBM Plex Sans';background:var(--paper);color:var(--ink);min-height:100vh;padding-bottom:110px}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--surf)}
.top .logo{display:flex;align-items:center;gap:9px;font:700 16px 'Space Grotesk'}.top .logo img{width:24px;height:24px}
.top .user{font:11px 'IBM Plex Mono';color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto;padding:32px 28px}
.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:26px}
.kick{font:11px 'IBM Plex Mono';color:var(--verm)}h1{font:700 30px 'Space Grotesk';margin:8px 0 0}
.btn{background:var(--verm);color:#fff;border:0;padding:9px 16px;font:600 13px 'IBM Plex Sans'}
.channels{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);background:var(--surf);margin-bottom:28px}
.ch{padding:16px 18px;border-right:1px solid var(--line)}.ch:last-child{border:0}
.ch .id{font:10px 'IBM Plex Mono';color:var(--muted)}
.ch .name{display:flex;gap:8px;align-items:center;font-weight:600;font-size:14px;margin-top:4px}.ch .name img{width:16px;height:16px}
.ch .st{font:10px 'IBM Plex Mono';margin-top:6px}.ch .st.on{color:#3a7d44}.ch .st.off{color:var(--muted)}
.acc{background:var(--surf);border:1px solid var(--line);padding:18px 22px;display:flex;align-items:center;gap:16px;margin-bottom:12px}
.acc img.av{width:48px;height:48px;border-radius:50%;border:1px solid var(--line)}
.acc .meta{flex:1}
.acc .nm{font:600 15px 'IBM Plex Sans'}
.acc .det{font:11px 'IBM Plex Mono';color:var(--muted);margin-top:3px}
.acc .stats{display:flex;gap:22px;font:11px 'IBM Plex Mono';color:var(--muted)}
.acc .stats b{display:block;font-size:15px;color:var(--ink)}
.acc .act button{background:none;border:1px solid var(--line);padding:7px 12px;font:600 12px 'IBM Plex Sans';margin-left:8px;cursor:pointer}
.dock{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:10px 14px;background:rgba(255,253,249,.88);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 32px rgba(60,45,30,.14)}
.dock a{position:relative;display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:14px;background:var(--paper);border:1px solid var(--line);color:var(--muted);transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.dock a svg{width:24px;height:24px}
.dock a:hover{transform:translateY(-10px) scale(1.18);background:#fff}
.dock a.on{color:var(--verm);background:#fdf1ea;border-color:#eccfbf}
.dock a.on::before{content:'';position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--verm)}
.dock .sep{width:1px;align-self:stretch;background:var(--line);margin:4px 2px}
</style></head><body>

</div></body></html>
